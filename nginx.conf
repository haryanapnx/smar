server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: let the client router handle unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The HTML entry must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml;
}
