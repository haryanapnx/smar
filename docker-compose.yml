services:
  # Production build served by nginx: http://localhost:8080
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MBTA_API_KEY: ${VITE_MBTA_API_KEY:-}
        VITE_MBTA_API_BASE_URL: ${VITE_MBTA_API_BASE_URL:-https://api-v3.mbta.com}
    image: smar-web:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional dev server with HMR: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: smar-web-dev:latest
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_MBTA_API_KEY: ${VITE_MBTA_API_KEY:-}
      VITE_MBTA_API_BASE_URL: ${VITE_MBTA_API_BASE_URL:-https://api-v3.mbta.com}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
