<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SMAR - Sistem Manajemen Armada" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>SMAR - Sistem Manajemen Armada</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('smar:theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
        document.documentElement.classList.toggle('dark', dark);
      } catch (error) {
        /* localStorage unavailable; fall back to light */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
